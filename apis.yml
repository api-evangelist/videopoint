name: VideoPoint
description: >-
  VideoPoint is a Shopify app from TouchPoints Inc. (a 500 Global portfolio
  company) that turns a merchant's existing product photos and videos into
  shoppable, on-site experiences on product-detail and collection pages, with
  the company reporting an 11-35% conversion uplift and 60-120x ROI from
  existing content. It is part of the broader TouchPoints suite of AI-powered
  Shopify apps (alongside TryPoint virtual try-on, plus A/B testing and
  AI-powered chat) built to engage shoppers, boost conversions, and drive more
  sales. VideoPoint ships as an embedded Shopify app installed from the Shopify
  App Store; it exposes no public developer API, OpenAPI, or documentation
  surface at this time. Added to the API Evangelist network as a company
  profile and enrichment lead.
